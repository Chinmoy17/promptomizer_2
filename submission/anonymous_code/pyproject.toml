[project]
name = "fdpo"
version = "0.1.0"
description = "FDPO: Feedback-Driven Modular Prompt Optimization - pilot experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "requests>=2.30",
    "truststore>=0.10.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdpo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
