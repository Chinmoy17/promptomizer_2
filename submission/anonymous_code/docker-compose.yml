services:
  fdpo:
    build: .
    image: fdpo:latest
    env_file:
      - .env
    # Linux-only: makes the container share the host's network namespace, so
    # SOLVER_BASE_URL=http://localhost:8000/v1 etc. in .env keep working
    # completely unchanged, exactly as documented in Docs/tamuk_handoff.md.
    # Does not work as-is on Docker Desktop for Mac/Windows.
    network_mode: host
    volumes:
      # Only results/ is mounted: output must survive `--rm` and land on the
      # host disk. Dataset/prompts/source are baked into the image itself.
      - ./results:/app/results
